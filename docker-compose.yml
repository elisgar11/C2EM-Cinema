services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DEBUG: ${DEBUG:-false}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      TIME_ZONE: ${TIME_ZONE:-Europe/Madrid}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      DEFAULT_ADMIN_ENABLED: ${DEFAULT_ADMIN_ENABLED:-true}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-admin}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@localhost}
      MOVIE_METADATA_PROVIDER: ${MOVIE_METADATA_PROVIDER:-tmdb}
      MOVIE_METADATA_AUTO_FETCH: ${MOVIE_METADATA_AUTO_FETCH:-true}
      MOVIE_METADATA_FETCH_IMAGES: ${MOVIE_METADATA_FETCH_IMAGES:-true}
      MOVIE_METADATA_IMAGE_TIMEOUT_SECONDS: ${MOVIE_METADATA_IMAGE_TIMEOUT_SECONDS:-8}
      MOVIE_METADATA_IMAGE_MAX_BYTES: ${MOVIE_METADATA_IMAGE_MAX_BYTES:-15728640}
      TMDB_API_TOKEN: ${TMDB_API_TOKEN:-}
      TMDB_LANGUAGE: ${TMDB_LANGUAGE:-es-ES}
      TMDB_FALLBACK_LANGUAGE: ${TMDB_FALLBACK_LANGUAGE:-en-US}
      TMDB_TIMEOUT_SECONDS: ${TMDB_TIMEOUT_SECONDS:-8}
      TMDB_MAX_CAST_MEMBERS: ${TMDB_MAX_CAST_MEMBERS:-12}
      TMDB_IMAGE_BASE_URL: ${TMDB_IMAGE_BASE_URL:-https://image.tmdb.org/t/p}
      TMDB_POSTER_PREVIEW_SIZE: ${TMDB_POSTER_PREVIEW_SIZE:-w342}
      TMDB_POSTER_SIZE: ${TMDB_POSTER_SIZE:-w780}
      TMDB_BACKDROP_SIZE: ${TMDB_BACKDROP_SIZE:-w1280}
      SQLITE_PATH: /app/data/db.sqlite3
      MEDIA_ROOT: /app/media
    volumes:
      - ./data:/app/data
      - ./media:/app/media
