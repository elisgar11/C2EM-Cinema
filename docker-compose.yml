services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DEBUG: ${DEBUG:-false}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      TIME_ZONE: ${TIME_ZONE:-Europe/Madrid}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      MOVIE_METADATA_PROVIDER: ${MOVIE_METADATA_PROVIDER:-tmdb}
      MOVIE_METADATA_AUTO_FETCH: ${MOVIE_METADATA_AUTO_FETCH:-true}
      TMDB_API_TOKEN: ${TMDB_API_TOKEN:-}
      TMDB_LANGUAGE: ${TMDB_LANGUAGE:-es-ES}
      TMDB_FALLBACK_LANGUAGE: ${TMDB_FALLBACK_LANGUAGE:-en-US}
      TMDB_TIMEOUT_SECONDS: ${TMDB_TIMEOUT_SECONDS:-8}
      TMDB_MAX_CAST_MEMBERS: ${TMDB_MAX_CAST_MEMBERS:-12}
      SQLITE_PATH: /app/data/db.sqlite3
      MEDIA_ROOT: /app/media
    volumes:
      - ./data:/app/data
      - ./media:/app/media
